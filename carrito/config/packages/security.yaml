security:
    # Configuración para hashear las contraseñas
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Cargamos los usuarios desde la entidad Usuario
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Usuario
                property: email

    # Configuración de los firewalls
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Login mediante formulario
            form_login:
                login_path: app_login
                check_path: app_login

            # Logout
            logout:
                path: app_logout

    # Control de acceso
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10